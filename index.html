<!doctype html>
<html lang="en-GB" data-theme="violet-bloom">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="googlebot" content="noindex,nofollow" />
    <meta name="description" content="Internal demo build. Not a public product." />
    <title>Creative Score</title>
    <link rel="icon" type="image/svg+xml" href="./logo/creative-score-mark-full-colour.svg" />
    <!--
      The layout a person left the app in, put on <html> before anything is
      drawn, so the first paint is already the right one. It reads the same
      store and the same person key as apps/web/src/layout/layoutStore.ts;
      a test holds the two to the same answer. Signed out, or anything it
      cannot read, means the current layout.
    -->
    <script>
      (function () {
        var layout = 'current';
        try {
          var store = JSON.parse(window.localStorage.getItem('cs-demo-store') || 'null') || {};
          var who = store.signedIn || null;
          var person = who && who.kind === 'demo' ? 'demo' : who && who.kind === 'account' ? 'account:' + who.id : null;
          var saved = person && store.layouts ? store.layouts[person] : null;
          if (saved === 'b' || saved === 'current') {
            layout = saved;
          }
        } catch (error) {
          layout = 'current';
        }
        document.documentElement.setAttribute('data-layout', layout);
      })();
    </script>
    <script type="module" crossorigin src="/creative-score-demo/assets/index-Yuq32fEO.js"></script>
    <link rel="stylesheet" crossorigin href="/creative-score-demo/assets/index-DFNW0vt6.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
